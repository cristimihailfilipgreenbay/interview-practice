server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxied to the `server` Compose service by name — same origin from the
    # browser's perspective, so no CORS is involved in this deployment shape at all.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular's client-side routing — fall back to index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
